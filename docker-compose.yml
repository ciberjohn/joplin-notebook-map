# Joplin Notebook Map — docker compose (loopback-only deployment)
#
# Security posture:
#   - host networking + app binds 127.0.0.1 → only the host (and therefore
#     `tailscale serve`) can reach it; nothing is published to the LAN/WAN.
#   - read_only rootfs, no-new-privileges, all capabilities dropped.
#   - Secrets come from .env (gitignored) — never from the image or repo.
#
# Access is via Tailscale Serve on a dedicated HTTPS port — NEVER Funnel.

services:
  notebook-map:
    build: .
    image: joplin-notebook-map:0.1.3
    container_name: joplin-notebook-map
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8910/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
